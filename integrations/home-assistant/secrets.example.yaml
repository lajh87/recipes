# Merge these example entries into /config/secrets.yaml, replacing both values.
# Use the cookbook server's LAN address, not localhost (which is Home Assistant).
# Include any reverse-proxy path prefix if you aren't connecting directly.
family_cookbook_meal_plan_url: "http://COOKBOOK_LAN_HOST:8080/api/integrations/home-assistant/meal-plan"
family_cookbook_authorization: "Bearer REPLACE_WITH_HOME_ASSISTANT_API_KEY"
